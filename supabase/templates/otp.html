<!doctype html>
<html lang="id">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #000;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 420px; background: #fff; border-radius: 16px; padding: 32px 24px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 8px; font-size: 15px; color: #3c3c43">Money Manager</p>
                <h1 style="margin: 0 0 24px; font-size: 22px; font-weight: 600">Kode masuk kamu</h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 36px;
                    font-weight: 700;
                    letter-spacing: 0.2em;
                    font-variant-numeric: tabular-nums;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3c3c43">
                  Masukkan kode ini di aplikasi. Kode berlaku 1 jam dan hanya bisa dipakai sekali.
                  Kalau kamu tidak sedang masuk, abaikan email ini.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
