<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Total akun</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css?v=17">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2254px; height: 1008px; box-sizing: border-box; padding: 40px; background: #FAFAFB; display: flex; gap: 56px; font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif; color: #1C1C1E">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="5">
<figure style="margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px">
<figcaption style="display: flex; flex-direction: column; gap: 3px; height: 74px"><b style="font-size: 19px; letter-spacing: -0.02em">{{p.title}}</b><span style="font-size: 14px; line-height: 1.4; color: #6C6C70">{{p.desc}}</span></figcaption>
<div style="width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 1px #E3E3E8, 0 24px 60px rgba(0,0,0,.12)">
<dc-import name="App" screen="{{p.screen}}" hint-size="390px,844px"></dc-import>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2254,"height":1008}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      phones: [
        { screen: 'accounts', title: 'Akun · kartu total', desc: 'Total akun tampil sebagai kartu di atas daftar; yang tampil di Transaksi disorot.' },
        { screen: 'totals', title: 'Total akun', desc: 'Daftar total beserta saldonya, plus akun yang belum masuk total mana pun.' },
        { screen: 'total-form', title: 'Ubah total', desc: 'Nama, tampil di Transaksi, dan anggota akun. Akun dari total lain bisa dipindah ke sini.' },
        { screen: 'daily', title: 'Transaksi tersaring', desc: 'Chip Σ Uang bulanan: transaksi dan ringkasan hanya dari akunnya. Ketuk untuk Semua akun.' },
        { screen: 'form-keypad', title: 'Pintasan impor di form', desc: 'Dari foto struk atau Dari mutasi bank langsung dari layar catat.' }
      ]
    };
  }
}
</script>
</body>
</html>
