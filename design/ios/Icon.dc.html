<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["food","coffee","car","bag","bolt","play","wallet","gift","swap","dots","bank","cash","phone","card","gear","repeat","star","tag","grid","chart","paint","lock","bell","cloud","upload","download","help","apps","coin","users","file","camera","history"],"default":"food"},"tone":{"editor":"enum","options":["orange","amber","blue","pink","purple","teal","green","gray","red","indigo"],"default":"orange"},"size":{"editor":"int","default":44,"min":20,"max":64},"solid":{"editor":"boolean","default":false},"$preview":{"width":44,"height":44}}'>
var TONES = {
  orange: ['#FFEEDD', '#B4500A', '#FF9500'],
  amber: ['#FDF3D3', '#8F5A06', '#E0A100'],
  blue: ['#E3ECFD', '#1D55CC', '#007AFF'],
  pink: ['#FCE6F0', '#B02A66', '#FF2D55'],
  purple: ['#EEE8FD', '#6236C6', '#AF52DE'],
  teal: ['#DDF4F0', '#0E6F63', '#30B0C7'],
  green: ['#E1F4E6', '#1B7038', '#34C759'],
  gray: ['#ECEFF4', '#424B5C', '#8E8E93'],
  red: ['#FDE7E9', '#B4232E', '#FF3B30'],
  indigo: ['#E9E8FC', '#3F3CB8', '#5856D6']
};
class Component extends DCLogic {
  renderVals() {
    var kind = this.props.kind || 'food';
    var t = TONES[this.props.tone] || TONES.gray;
    var px = Number(this.props.size) || 44;
    var solid = !!this.props.solid;
    var k = {};
    k[kind] = true;
    return {
      k: k, bg: solid ? t[2] : t[0], fg: solid ? '#FFFFFF' : t[1], px: px,
      radius: Math.round(px * (solid ? 0.24 : 0.3)), isz: Math.round(px * (solid ? 0.58 : 0.5)), sw: solid ? 2.2 : 2
    };
  }
}
</script>
