<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tab Lainnya dan widget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css?v=17">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1362px; height: 1008px; box-sizing: border-box; padding: 40px; background: #FAFAFB; display: flex; gap: 56px; font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif; color: #1C1C1E">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="3">
<figure style="margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px">
<figcaption style="display: flex; flex-direction: column; gap: 3px; height: 74px"><b style="font-size: 19px; letter-spacing: -0.02em">{{p.title}}</b><span style="font-size: 14px; line-height: 1.4; color: #6C6C70">{{p.desc}}</span></figcaption>
<div style="width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 1px #E3E3E8, 0 24px 60px rgba(0,0,0,.12)">
<dc-import name="App" screen="{{p.screen}}" hint-size="390px,844px"></dc-import>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1362,"height":1008}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      phones: [
        { screen: 'more', title: 'Lainnya', desc: 'Gaya pengaturan iOS: buku bersama di atas, lalu transaksi, data, tampilan, cadangan & impor.' },
        { screen: 'settings', title: 'Pengaturan transaksi', desc: 'Tanggal awal bulan, awal minggu, geser = pindah bulan, input jam, carry-over, tampilan kartu.' },
        { screen: 'widgets', title: 'Widget layar utama', desc: 'Catat cepat, tagihan kartu, dan pemasukan/pengeluaran bulan ini dengan budget.' }
      ]
    };
  }
}
</script>
</body>
</html>
